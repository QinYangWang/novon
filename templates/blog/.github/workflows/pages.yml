name: pages

# Build with novon and publish to GitHub Pages on every push to main.
#
# One-time setup: Settings → Pages → Source "GitHub Actions".
# A project site is served at https://<owner>.github.io/<repo>/, which is what `base` and `url`
# below say. On a <owner>.github.io repository drop `base` and use `url: https://<owner>.github.io/`;
# on a custom domain drop `base`, add `cname: your.domain`, and point `url` at it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: QinYangWang/novon/.github/workflows/pages.yml@main
    with:
      base: /${{ github.event.repository.name }}/
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
