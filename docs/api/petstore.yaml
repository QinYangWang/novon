openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
  description: |
    A small example API. novon renders this file as the pages under `/reference`.
servers:
  - url: https://petstore.example.com/v1
security:
  - bearer: []
tags:
  - name: Pets
    description: Pets in the store.
  - name: Orders
    description: Orders placed for pets.
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      description: Returns pets, newest first.
      tags: [Pets]
      parameters:
        - name: limit
          in: query
          description: How many pets to return, at most 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: kind
          in: query
          description: Only pets of this kind.
          schema: { $ref: '#/components/schemas/Kind' }
      responses:
        '200':
          description: A page of pets.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Pet' }
                  next:
                    type: string
                    description: Cursor for the next page, when there is one.
    post:
      operationId: createPet
      summary: Create a pet
      tags: [Pets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPet' }
      responses:
        '201':
          description: The new pet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '422':
          description: The pet is not valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: The pet's id.
        schema: { type: string, example: pet_123 }
    get:
      operationId: getPet
      summary: Get a pet
      tags: [Pets]
      responses:
        '200':
          description: The pet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '404':
          description: No pet with this id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags: [Pets]
      responses:
        '204':
          description: Deleted.
  /orders:
    post:
      operationId: placeOrder
      summary: Place an order
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '201':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API key sent as a bearer token.
  schemas:
    Kind:
      type: string
      enum: [cat, dog, bird]
    NewPet:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, description: The pet's name., example: Mochi }
        kind: { $ref: '#/components/schemas/Kind' }
        tags:
          type: array
          items: { type: string }
          example: [calm]
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, example: pet_123 }
            createdAt: { type: string, format: date-time }
    Order:
      type: object
      required: [petId, quantity]
      properties:
        id: { type: string, readOnly: true, example: ord_9 }
        petId: { type: string, example: pet_123 }
        quantity: { type: integer, minimum: 1, example: 1 }
        status: { type: string, enum: [placed, shipped, delivered], readOnly: true }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string, example: name is required }
